// 调用的 gradle 插件
plugins {
    id 'java-library'

    // 用于 eclipse 或者 idea 的插件
    id 'eclipse'
    id 'idea'

    // NeoForged 开发插件
    id 'net.neoforged.moddev' version '2.0.148'

    // Shadow 插件，用于打包依赖到 jar 包里
    id 'com.gradleup.shadow' version '9.4.1'

    // 发布到 maven 仓库的插件
    id 'maven-publish'

    // OpenRewrite 插件，用于自动化处理 Minecraft 或者 NeoForge 更新时的代码修改
    id "org.openrewrite.rewrite" version "7.35.0"
}

// ALL 为下载 gradle 源码，方便查看调试
tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.ALL
}

// 需要 Java 25 版本
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// 模组相关信息
version = mod_version
group = mod_group_id

// 打包成 jar 时的名称
base {
    archivesName = 'touhoulittlemaid'
}

// 需要的前置库
repositories {
    // ./libs 目录为库
    flatDir {
        dir "libs"
    }
    mavenCentral()
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        url "https://maven.shedaniel.me/"
        content {
            includeGroup "me.shedaniel"
            includeGroup "me.shedaniel.cloth"
            includeGroup "dev.architectury"
        }
    }
    maven {
        url "https://maven2.bai.lol"
        content {
            includeGroup "mcp.mobius.waila"
            includeGroup "lol.bai"
        }
    }
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
        content {
            includeGroup "dev.emi"
        }
    }
    maven {
        name 'cursemaven'
        url "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven { // for TOP
        url "https://maven.k-4u.nl/"
        content {
            includeGroup "mcjty.theoneprobe"
        }
    }
    maven {
        url = "https://maven.theillusivec4.top/"
        content {
            includeGroup "top.theillusivec4.curios"
        }
    }
    maven {
        url "https://maven.latvian.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
            includeGroup "dev.latvian.apps"
        }
    }
    maven {
        url = "https://maven.architectury.dev"
        content {
            includeGroup "dev.architectury"
        }
    }
    maven {
        url 'https://jitpack.io'
        content {
            includeGroup "com.github.rtyley"
            includeGroup "com.github.MUKSC"
            includeGroup "com.github.FiguraMC.luaj"
        }
    }
    maven {
        url = "https://maven.createmod.net"
        content {
            includeGroup "net.createmod.ponder"
            includeGroup "dev.engine-room.flywheel"
        }
    }
    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex("software\\.bernie.*")
            includeGroup("com.eliotlash.mclib")
        }
    }
    maven {
        url = "https://maven.ryanhcode.dev/releases"
        name = "RyanHCode Maven"
        content {
            includeGroup "dev.ryanhcode.sable"
            includeGroup "dev.ryanhcode.sable-companion"
        }
    }
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" }
}

neoForge {
    // NeoForge 版本信息
    version = project.neo_version

    // 运行部分
    runs {
        client {
            client()
            gameDirectory = project.file('run/client')
            programArguments = [
                    "--username", "tartaric_acid"
            ]
            // 客户端 mixin、渲染器、查看器插件都只有进了世界才会生效，所以验证得越过主菜单。
            // -Pquickplay=<存档名> 直接进 run/client/saves 下的存档；不给参数就停在主菜单。
            if (project.hasProperty('quickplay')) {
                programArgument '--quickPlaySingleplayer'
                programArgument project.property('quickplay').toString()
            }
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            gameDirectory = project.file('run/server')
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            gameDirectory = project.file('run/gameTestServer')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            gameDirectory = project.file('run/data')
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            // +AllowEnhancedClassRedefinition 为 JetBrains Runtime 所需的参数
            // JetBrains Runtime 是一个修改过的 JDK，支持热重载
            // +IgnoreUnrecognizedVMOptions 用于忽略未知指令
            // 否则没有安装 JetBrains Runtime 的用户运行时会报错
            jvmArguments = [
                    '-XX:+IgnoreUnrecognizedVMOptions',
                    '-XX:+AllowEnhancedClassRedefinition'
            ]
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            // 参考：https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
            // 控制台彩色打印
            systemProperty 'terminal.jline', 'true'
        }
    }

    mods {
        // 定义 mod <-> 源码的绑定关系，用于告知游戏每个 mod 对应哪些源码
        // 单 mod 项目通常可省略，多 mod 项目应为每个 mod 单独定义
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main {
    java {
        srcDir layout.buildDirectory.dir("generated/sources/annotationProcessor/java/main")
    }
    resources {
        srcDir 'src/generated/resources'
        // datagen 的 HashCache 会在 --output 目录下写 .cache/，它只是增量重生成的账本，
        // 运行期用不到；而 src/generated/resources 整个是 resources 源目录，不排掉就会被打进 jar。
        exclude '.cache/**'
    }
}

// Aquaculture 的编译期桩。它只被 `compileOnly` 引用（见上面 dependencies），所以既不进 jar
// 也不进运行时类路径；把源码放在独立 source set 里是为了让它和主源码分开、便于上游出 26.3 后整体删除。
sourceSets {
    aquacultureStub {
        java.srcDir 'src/aquacultureStub/java'
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime

    // 桩要编译原版 / NeoForge 的类型（ItemStack、ToolMaterial、EntityType…）。自定义 source set
    // 默认拿不到 MDG 挂的 minecraft 类路径——MDG 把它放在 modDevCompileDependencies 上，再被主
    // 源码集的 compileClasspath 继承——所以这里显式继承一份。
    // 刻意不继承主源码集的 compileClasspath：那条边里含桩自己的输出（主源码集 compileOnly 了
    // 它），会让 compileAquacultureStubJava 自己依赖自己。
    aquacultureStubCompileClasspath.extendsFrom modDevCompileDependencies

    // 自定义一个 minecraftLibrary，方便引入需要 jarJar 的库
    mcLib
    implementation {
        extendsFrom mcLib
    }
    additionalRuntimeClasspath {
        extendsFrom mcLib
    }
}

dependencies {
    annotationProcessor project(':maid-manager-codegen')
    annotationProcessor 'com.squareup:javapoet:1.13.0'

    // Opus 音频解码库
    mcLib "org.gagravarr:vorbis-java-core:0.8"
    mcLib "io.github.jaredmdobson:concentus:1.0.2"

    // MP3 音频解码库
    mcLib "com.googlecode.soundlibs:mp3spi:1.9.5.4"

    // YAML 库
    mcLib "org.yaml:snakeyaml:2.4"

    // 单元测试
    testImplementation 'junit:junit:4.13.2'

    // JEI
    implementation "maven.modrinth:jei:31.8.0.53-neoforge"

    // Cloth Config
    implementation "maven.modrinth:cloth-config:26.3.159+neoforge"

    // Jade
    // 刻意停在 26.3.1 而不是 26.3.4（2026-10-02 发布）：26.3.4 把 JsonConfig$CachedSupplier.get()
    // 里 value 的赋值挪到了 onUpdate 回调之后（26.3.1 是 `T _value = value = supplier.get();`
    // 先赋值再回调），于是一进世界前加载客户端配置就死循环：
    //   CachedSupplier.get → onUpdate → WailaConfig.fixData → ClientPluginConfig.ensureEntry
    //   → mergedValues 首次合并 old==null → ConfigEntry.notifyChange
    //   → CorePlugin.lambda$registerClient$0 里监听器回读 IWailaConfig.get()
    //   → 又回到同一个还没赋值的 CachedSupplier → StackOverflowError
    // mergedValues 每次启动都是空的，所以 26.3.4 是必崩，与 TLM 无关。等上游修好再升。
    implementation "maven.modrinth:jade:26.3.1+neoforge"

    // Curios
    // Modrinth 上最新的 curios 17.0.0-beta.2+26.3（2026-09-26）是对着更早的 NeoForge 26.3 构建编的，
    // 它的 CuriosCommonMod 还引用 ModConfig.Type.COMMON / SERVER——这俩常量在 FML 12 里已改成
    // LOCAL / CLIENT / SYNCED / STARTUP，于是模组构造阶段直接 NoSuchFieldError。
    // 整包 214 处 net/neoforged 引用里只有这 2 处不解析、且都在同一个类里，所以不反编译重编译，
    // 直接改常量池即可：tlm-port/curios-patch/patch_curios.py（COMMON→LOCAL、SERVER→SYNCED），
    // 产出 tlm-port/libs/curios-...-patched.jar。打完补丁用 tools/scan_jar_api.py 复扫为 0 处不解析。
    // 上游跟上 26.3.0.40-beta 后可以删掉补丁脚本换回 maven.modrinth 坐标。
    implementation files('../libs/curios-neoforge-17.0.0-beta.2+26.3-patched.jar')

    // Patchouli
    // 上游没有 26.3 版（最新仍是 26.1-94-beta），所以这份 jar 是本仓库里自己移植的产物，
    // 由 tlm-port/Patchouli 构建后产出到 tlm-port/libs/。见 Patchouli/gradle.properties 的版本改动。
    implementation files('../libs/Patchouli-26.3.jar')

    // IPN
    // runtimeOnly "maven.modrinth:kotlin-for-forge:6.2.0"
    // runtimeOnly "maven.modrinth:libipn:neoforge-26.1.2-6.7.2"
    compileOnly "maven.modrinth:inventory-profiles-next:neoforge-26.3-2.3.8"

    compileOnly "maven.modrinth:sodium:mc26.3-0.9.3-alpha.1-neoforge"
    compileOnly "maven.modrinth:iris:1.11.7+26.3-neoforge"

    // Aquaculture 也没有 26.3 版。compat/aquaculture 的代码保持原样，改由本地桩提供编译期 API 表面
    // ——桩只在编译类路径上，不进 jar、不进运行时，见 src/aquacultureStub/README.md。
    compileOnly sourceSets.aquacultureStub.output

    implementation "maven.modrinth:sophisticated-core:26.3-1.5.3.2358"
    implementation "maven.modrinth:sophisticated-backpacks:26.3-3.26.5.2181"
}

shadowJar {
    configurations = [project.configurations.mcLib]

    // MP3 音频库 居然会把 junit 打包进去……
    dependencies {
        exclude(dependency('junit:junit'))
    }

    // 包重定向
    relocate 'io.github.jaredmdobson.concentus', 'com.github.tartaricacid.touhoulittlemaid.libs.concentus'
    relocate 'org.gagravarr', 'com.github.tartaricacid.touhoulittlemaid.libs.gagravarr'
    relocate 'javazoom.jl', 'com.github.tartaricacid.touhoulittlemaid.libs.javazoom.jl'
    relocate 'javazoom.spi', 'com.github.tartaricacid.touhoulittlemaid.libs.javazoom.spi'
    relocate 'org.tritonus', 'com.github.tartaricacid.touhoulittlemaid.libs.org.tritonus'
    relocate 'org.yaml.snakeyaml', 'com.github.tartaricacid.touhoulittlemaid.libs.snakeyaml'

    // 排除不需要的依赖项和资源
    exclude 'META-INF/maven/**/*'
    exclude 'META-INF/versions/**/*'
    // 这个版权许可都已经手动添加进 licenses 里了
    exclude 'META-INF/LICENSE'

    mergeServiceFiles()
    minimize()
}

assemble {
    dependsOn shadowJar
}

tasks.compileJava {
    // dsx137: 强制重新编译和生成 refmap.json 文件，避免偶发情况下该文件丢失问题
    outputs.upToDateWhen { false }
}

// 用于 neoforge.mods 里替换那一堆 ${xxxx}
tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

// 生成 manifest 内容，用于填充版本信息等内容
jar {
    enabled = false // 禁用默认的 jar 任务
    manifest {
        attributes([
                "Implementation-Title"  : project.name,
                "Implementation-Version": "${version}"
        ])
    }
}

// 必须，编码需要显式指定为 UTF
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xlint:-removal']
    options.encoding = 'UTF-8'
    // 默认 100 条的错误上限会把后面的错误尾巴藏起来，让"还剩多少"完全看不出来。
    // 移植期需要一次看全，收敛完可以调回去。
    options.compilerArgs += ['-Xmaxerrs', '4000']
}

// 让 idea 主动下载前置库的源码和 Javadoc
// 新版本 idea 默认不会下载这两个，这虽然加快了构建速度，但是不方便调试
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

java {
    // 编译源码文件，方便发布 maven
    withSourcesJar()
}

tasks.named('sourcesJar') {
    // sourcesJar 会打包 annotationProcessor 生成的源码目录，显式依赖 compileJava
    dependsOn tasks.named('compileJava')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            // 使用 shadowJar 作为主要产物
            artifact(shadowJar.archiveFile) {
                classifier = null
                builtBy shadowJar
            }
        }
    }
    repositories {
        mavenLocal()  // JitPack 需要发布到本地仓库
    }
}

rewrite {
    activeRecipe("com.github.tartaricacid.Upgrade")
}

tasks.register('applyDiffPatches', Exec as Class<Task>) {
    group = 'rewrite'
    workingDir = projectDir
    // 使用 git apply 来应用补丁
    commandLine 'git', 'apply', '--ignore-space-change', '--ignore-whitespace', 'patches/migrate.patch'
}

tasks.named("rewriteRun") {
    finalizedBy("applyDiffPatches")
}